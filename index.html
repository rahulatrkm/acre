<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Acre — a farm tycoon you can play in a browser</title>
<meta name="description" content="Plant crops, raise animals, run a mill and a bakery, and grow a farm that earns while you are away. 24 levels, free, no download, plays in your browser." />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#7ec96b" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  /* ------------------------------------------------------------------
     A deliberate break from the rest of the portfolio's dark minimalism.
     Tycoon games live or die on warmth and tactility: chunky rounded
     shapes, a top highlight and a bottom shadow on everything so it reads
     as a physical button, and a palette of sun, soil and grass.
     ------------------------------------------------------------------ */
  :root{
    --sky1:#8ed7ff; --sky2:#c9edff;
    --grass:#7ec96b; --grass-d:#5aa84c; --grass-l:#a3e08d;
    --soil:#8a5a34; --soil-d:#6b452a; --soil-l:#a97245;
    --wood:#d29a5c; --wood-d:#a8763f;
    --cream:#fffaf0; --cream-2:#fff2dc; --edge:#e3cba4;
    --ink:#4a3520; --ink-2:#7a6046; --ink-3:#a08a70;
    --coin:#ffc94a; --coin-d:#f0a022;
    --go:#4ecb63; --go-d:#33a447;
    --no:#e57a5a; --no-d:#c85a3c;
    --gem:#8f7ff0;
    --r:16px; --pop:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
    color:var(--ink); overflow:hidden; touch-action:manipulation;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,#dff3c9 42%,#cbe9b0 100%);
    user-select:none;
  }
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}

  /* the whole game sits in a phone-shaped column, centred on a desk on wide screens */
  #app{position:relative; width:100%; max-width:540px; height:100%; margin:0 auto;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 24px 60px -20px rgba(60,40,20,.45)}
  @media (min-width:640px){ body{background:#b9e3f5} #app{height:min(100%,940px); margin-top:max(0px,calc((100vh - 940px)/2)); border-radius:22px} }

  /* ---------------- top bar ---------------- */
  .hud{position:relative; z-index:5; padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:linear-gradient(180deg,#5aa84c,#4a9440); box-shadow:0 3px 0 #3d7d36, 0 6px 14px rgba(0,0,0,.18)}
  .hud-row{display:flex; align-items:center; gap:8px}
  .purse{display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.18);
    border-radius:999px; padding:5px 12px 5px 6px; color:#fff; font-weight:800; font-size:15px;
    letter-spacing:.01em; box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .purse svg{width:22px; height:22px; flex:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .purse.pulse{animation:purse .45s var(--pop)}
  @keyframes purse{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
  .spacer{margin-left:auto}
  .iconbtn{width:36px; height:36px; border-radius:11px; background:rgba(0,0,0,.18);
    display:grid; place-items:center; color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .iconbtn:active{transform:translateY(1px)}
  .iconbtn svg{width:19px; height:19px}

  .lvlrow{display:flex; align-items:center; gap:9px; margin-top:9px}
  .lvlbadge{position:relative; width:34px; height:34px; flex:none; display:grid; place-items:center;
    font-weight:800; font-size:14px; color:#6b4b12;
    background:radial-gradient(circle at 35% 30%,#ffe08a,var(--coin) 62%,var(--coin-d));
    border-radius:50%; box-shadow:0 2px 0 #c8811a, 0 4px 8px rgba(0,0,0,.2)}
  .xpwrap{flex:1; height:13px; border-radius:999px; background:rgba(0,0,0,.22);
    overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
  .xpbar{height:100%; width:0%; border-radius:999px;
    background:linear-gradient(180deg,#b6f07f,#7ed957); transition:width .5s var(--ease);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .xptxt{font-size:11px; font-weight:700; color:rgba(255,255,255,.85); min-width:52px; text-align:right}

  /* ---------------- objective card ---------------- */
  .goal{margin:8px 12px 0; background:var(--cream); border-radius:var(--r);
    padding:9px 12px; box-shadow:0 3px 0 var(--edge), 0 6px 14px rgba(90,60,30,.16);
    display:flex; gap:11px; align-items:center}
  .goal .tag{font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-3)}
  .goal b{display:block; font-size:14.5px; margin-top:1px; line-height:1.3}
  .goal .bar{margin-top:6px; height:9px; border-radius:999px; background:#eadcc4; overflow:hidden}
  .goal .bar i{display:block; height:100%; border-radius:999px;
    background:linear-gradient(180deg,#7ed957,var(--grass-d)); transition:width .45s var(--ease)}
  .goal .who{flex:1; min-width:0}
  .goal .reward{flex:none; text-align:center; font-size:11px; font-weight:800; color:var(--coin-d)}
  .goal .reward svg{width:26px; height:26px; display:block; margin:0 auto 2px}

  /* ---------------- scroll area ---------------- */
  .scroll{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:12px 12px 6px; scrollbar-width:thin}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(120,90,50,.3); border-radius:9px}

  .sect{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:#5d7f4a; margin:11px 2px 6px; display:flex; align-items:center; gap:7px}
  .sect:first-child{margin-top:2px}
  .sect::after{content:""; flex:1; height:2px; border-radius:2px; background:rgba(90,120,70,.18)}

  /* ---------------- plots ---------------- */
  .plots{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
  @media (max-width:400px){ .plots{grid-template-columns:repeat(3,1fr)} }
  .plot{position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,var(--soil-l),var(--soil) 55%,var(--soil-d));
    box-shadow:0 3px 0 #55371f, 0 5px 10px rgba(60,35,10,.25),
      inset 0 2px 0 rgba(255,255,255,.14); transition:transform .12s var(--pop)}
  .plot:active{transform:translateY(2px) scale(.98)}
  .plot .furrow{position:absolute; inset:0; opacity:.32;
    background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.25) 8px 10px)}
  .plot .art{position:absolute; inset:0; display:grid; place-items:center}
  .plot .art svg{width:66%; height:66%; overflow:visible}
  .plot.ready{animation:bob 1.5s ease-in-out infinite}
  .plot.ready::after{content:""; position:absolute; inset:-2px; border-radius:16px;
    box-shadow:0 0 0 3px rgba(255,214,90,.9), 0 0 18px rgba(255,201,74,.7); pointer-events:none;
    animation:glow 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  .plot.empty .art svg{opacity:.34; filter:saturate(.5)}
  .plot.empty::before{content:""; position:absolute; inset:7px; border-radius:9px;
    border:2px dashed rgba(255,255,255,.28)}
  .plot .timer{position:absolute; left:5px; right:5px; bottom:5px; height:7px; border-radius:9px;
    background:rgba(0,0,0,.4); overflow:hidden}
  .plot .timer i{display:block; height:100%; border-radius:9px;
    background:linear-gradient(180deg,#ffe08a,var(--coin)); transition:width .3s linear}
  .plot .lock{position:absolute; inset:0; display:grid; place-items:center;
    background:rgba(40,26,14,.55); color:#f6e6cc; font-weight:800; font-size:11px; text-align:center;
    padding:6px; line-height:1.35}
  .plot .lock svg{width:20px; height:20px; display:block; margin:0 auto 4px; opacity:.9}
  .plot.buy{background:linear-gradient(180deg,#a7cf90,#8bbb74); box-shadow:0 3px 0 #6f9a5b}
  .plot.buy .lock{background:none; color:#2f4a24}

  /* ---------------- pens and buildings ---------------- */
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .card{position:relative; background:var(--cream); border-radius:var(--r); padding:10px;
    box-shadow:0 3px 0 var(--edge), 0 6px 12px rgba(90,60,30,.14); overflow:hidden;
    transition:transform .12s var(--pop)}
  .card:active{transform:translateY(2px) scale(.99)}
  .card .top{display:flex; align-items:center; gap:8px}
  .card .pic{width:42px; height:42px; flex:none; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(180deg,#fff,#f2e3c8); box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .card .pic svg{width:30px; height:30px; overflow:visible}
  .card .nm{font-weight:800; font-size:13.5px; line-height:1.2}
  .card .sub{font-size:11px; color:var(--ink-2); margin-top:1px}
  .card .bar{margin-top:8px; height:8px; border-radius:9px; background:#eadcc4; overflow:hidden}
  .card .bar i{display:block; height:100%; border-radius:9px;
    background:linear-gradient(180deg,#ffe08a,var(--coin)); transition:width .3s linear}
  .card.ready{box-shadow:0 3px 0 var(--coin-d), 0 0 0 3px rgba(255,214,90,.85), 0 6px 16px rgba(240,160,34,.35)}
  .card.ready .nm{color:var(--coin-d)}
  .card.locked{opacity:.62; filter:saturate(.4)}
  .card .cost{position:absolute; right:9px; top:9px; font-size:11px; font-weight:800; color:var(--coin-d)}

  /* ---------------- seed tray ---------------- */
  .tray{background:linear-gradient(180deg,var(--wood),var(--wood-d));
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -3px 0 #8e6234, 0 -6px 16px rgba(0,0,0,.2); z-index:5}
  .traytabs{display:flex; gap:6px; margin-bottom:6px}
  .tt{flex:1; text-align:center; font-size:11.5px; font-weight:800; padding:5px 4px; border-radius:9px;
    color:#facf9b; background:rgba(0,0,0,.18)}
  .tt.on{background:var(--cream); color:var(--ink); box-shadow:0 2px 0 var(--edge)}
  .rail{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .seed{position:relative; flex:none; width:74px; background:var(--cream); border-radius:13px;
    padding:7px 6px 6px; text-align:center; box-shadow:0 3px 0 var(--edge);
    transition:transform .12s var(--pop)}
  .seed:active{transform:translateY(2px)}
  .seed.on{box-shadow:0 3px 0 var(--go-d), 0 0 0 3px var(--go)}
  .seed.no{opacity:.5; filter:saturate(.35)}
  .seed svg{width:32px; height:32px; overflow:visible; display:block; margin:0 auto}
  .seed .nm{display:block; font-size:10.5px; font-weight:800; margin-top:1px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; line-height:1.25}
  .seed .pr{display:block; font-size:10px; font-weight:800; color:var(--coin-d); line-height:1.25}
  .seed .have{position:absolute; top:-5px; right:-4px; min-width:19px; height:19px; padding:0 4px;
    border-radius:999px; background:var(--go); color:#fff; font-size:10.5px; font-weight:800;
    display:grid; place-items:center; box-shadow:0 2px 0 var(--go-d)}

  /* ---------------- floating feedback ---------------- */
  #fx{position:absolute; inset:0; pointer-events:none; z-index:30; overflow:hidden}
  .float{position:absolute; font-weight:800; font-size:15px; white-space:nowrap;
    text-shadow:0 2px 0 rgba(0,0,0,.18); animation:floatup 1s var(--ease) forwards}
  @keyframes floatup{0%{opacity:0; transform:translate(-50%,0) scale(.7)}
    18%{opacity:1; transform:translate(-50%,-10px) scale(1.08)}
    100%{opacity:0; transform:translate(-50%,-46px) scale(1)}}
  .coinfly{position:absolute; width:20px; height:20px; will-change:transform}

  /* ---------------- sheets ---------------- */
  .sheet{position:absolute; inset:0; z-index:40; background:rgba(30,20,10,.5);
    display:none; align-items:flex-end; backdrop-filter:blur(2px)}
  .sheet.on{display:flex}
  .sheet .pane{width:100%; background:var(--cream); border-radius:22px 22px 0 0;
    padding:16px 16px calc(18px + env(safe-area-inset-bottom)); max-height:86%; overflow-y:auto;
    animation:rise .3s var(--ease)}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{font-size:17px; font-weight:800; margin-bottom:2px}
  .sheet .lede{font-size:12.5px; color:var(--ink-2); margin-bottom:12px}
  .row{display:flex; align-items:center; gap:11px; background:var(--cream-2); border-radius:13px;
    padding:10px 11px; margin-bottom:8px; box-shadow:0 2px 0 var(--edge)}
  .row .pic{width:38px; height:38px; flex:none; display:grid; place-items:center}
  .row .pic svg{width:30px; height:30px; overflow:visible}
  .row .who{flex:1; min-width:0}
  .row .who b{display:block; font-size:13.5px}
  .row .who span{font-size:11.5px; color:var(--ink-2)}
  .btn{flex:none; padding:9px 15px; border-radius:11px; font-weight:800; font-size:13px; color:#fff;
    background:linear-gradient(180deg,var(--go),var(--go-d)); box-shadow:0 3px 0 #2b8a3b;
    transition:transform .1s var(--pop)}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #2b8a3b}
  .btn.gold{background:linear-gradient(180deg,#ffd76b,var(--coin-d)); box-shadow:0 3px 0 #c8811a; color:#5b3d0a}
  .btn.flat{background:#e8dcc4; box-shadow:0 3px 0 #cdbb9a; color:var(--ink)}
  .btn:disabled{opacity:.45; box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .btn.wide{width:100%; text-align:center; padding:13px; font-size:15px; margin-top:6px}

  /* ---------------- banners ---------------- */
  .banner{position:absolute; left:50%; top:22%; transform:translate(-50%,-8px); z-index:45;
    background:linear-gradient(180deg,#fff8e2,#ffe9b8); border-radius:18px; padding:16px 26px;
    text-align:center; box-shadow:0 6px 0 #d9ab52, 0 18px 40px rgba(80,50,10,.4);
    opacity:0; pointer-events:none; transition:opacity .3s, transform .35s var(--pop)}
  .banner.on{opacity:1; transform:translate(-50%,0)}
  .banner .big{font-size:22px; font-weight:800; color:#8a5a12}
  .banner .sm{font-size:13px; color:var(--ink-2); margin-top:3px}

  /* ---------------- start screen ---------------- */
  .start{position:absolute; inset:0; z-index:60; display:grid; place-items:center; padding:24px;
    background:linear-gradient(180deg,#8ed7ff,#c9edff 45%,#a3e08d 45%,#7ec96b)}
  .start.off{display:none}
  .start .box{text-align:center; max-width:340px}
  .start .logo{font-size:clamp(2.6rem,13vw,3.4rem); font-weight:800; letter-spacing:-.02em;
    color:#fff; text-shadow:0 4px 0 #4a9440, 0 8px 18px rgba(0,0,0,.28)}
  .start .tag{color:#3f5d2f; font-weight:700; font-size:14px; margin:8px 0 20px; line-height:1.5}
  .start .scene{width:190px; height:130px; margin:0 auto 6px}
  .note{font-size:11.5px; color:#4a6b3a; margin-top:12px; line-height:1.5}

  :focus-visible{outline:3px solid #2f6fd0; outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{
    animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
  <header class="hud">
    <div class="hud-row">
      <div class="purse" id="purse"><span id="coinIcon"></span><span id="coins">0</span></div>
      <div class="purse" id="gemPurse" style="display:none"><span id="gemIcon"></span><span id="gems">0</span></div>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnShop" aria-label="Shop and upgrades">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.2 11.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </button>
      <button class="iconbtn" id="btnSound" aria-label="Toggle sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8 6 11H3v4h3l4 3z"/><path d="M14.5 9.5a4 4 0 0 1 0 5"/><path d="M17 7a7.5 7.5 0 0 1 0 10"/></svg>
      </button>
      <button class="iconbtn" id="btnMenu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="lvlrow">
      <div class="lvlbadge" id="lvlBadge">1</div>
      <div class="xpwrap"><div class="xpbar" id="xpBar"></div></div>
      <div class="xptxt" id="xpTxt">0 / 10</div>
    </div>
  </header>

  <div class="goal" id="goalCard">
    <div class="who">
      <div class="tag" id="goalTag">Level 1</div>
      <b id="goalText">Harvest 6 wheat</b>
      <div class="bar"><i id="goalBar"></i></div>
    </div>
    <div class="reward"><span id="goalRewardIcon"></span><span id="goalReward">+50</span></div>
  </div>

  <main class="scroll" id="scroll">
    <div class="sect">Fields</div>
    <div class="plots" id="plots"></div>
    <div class="sect" id="penSect">Animals</div>
    <div class="cards" id="pens"></div>
    <div class="sect" id="bldSect">Workshops</div>
    <div class="cards" id="builds"></div>
    <div style="height:8px"></div>
  </main>

  <footer class="tray">
    <div class="traytabs">
      <button class="tt on" data-tab="seeds">Seeds</button>
      <button class="tt" data-tab="goods">Barn</button>
    </div>
    <div class="rail" id="rail"></div>
  </footer>

  <div id="fx"></div>

  <div class="banner" id="banner"><div class="big" id="bannerBig">Level 2</div><div class="sm" id="bannerSm">New crop unlocked</div></div>

  <div class="sheet" id="sheet"><div class="pane" id="sheetPane"></div></div>

  <div class="start" id="start">
    <div class="box">
      <div class="scene" id="startScene"></div>
      <div class="logo">Acre</div>
      <p class="tag">Plant it, harvest it, mill it, bake it.<br/>Build a farm that keeps earning while you are gone.</p>
      <button class="btn wide gold" id="btnPlay">Start farming</button>
      <button class="btn wide flat" id="btnContinue" style="display:none">Continue</button>
      <p class="note">Free, saves on your device, works offline.<br/>No account, no ads, nothing to install.</p>
    </div>
  </div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- art
/* Everything is drawn as SVG at load. No image files means the whole game is
   one document that works offline, and icons stay crisp at any size. */
const S = (inner, vb) => `<svg viewBox="${vb || "0 0 32 32"}" aria-hidden="true">${inner}</svg>`;

  {t:"Fill the barn: 60 of anything",k:"any",     n:60,                 coins:1500000},
];

const xpNeed = lvl => Math.round(10 * Math.pow(lvl, 1.55));
const fmt = n => {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, "") + "k";
  if (n < 1e9) return (n / 1e6).toFixed(n < 1e7 ? 2 : 1).replace(/\.?0+$/, "") + "m";
  return (n / 1e9).toFixed(2).replace(/\.?0+$/, "") + "b";
};
const clock = s => {
  s = Math.max(0, Math.ceil(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60 ? (s % 60) + "s" : "");
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
};

// ---------------------------------------------------------------- state
const SAVE = "acre_farm_v1";
const OFFLINE_CAP = 8 * 3600;          // generous but not a free win for vanishing
const now = () => Date.now();

function freshState() {
  return {
    coins: 25, xp: 0, lvl: 1, goal: 0, earned: 0,
    plots: Array.from({ length: MAX_PLOTS }, () => null),
    owned: START_PLOTS,
    animals: {}, builds: {}, inv: {}, upg: { sprinkler: 0, market: 0, hand: 0, oven: 0 },
    seed: "wheat", tab: "seeds", harvested: {}, sound: true, seen: now(),
  };
}
let G = freshState();
let running = false;

// ---------------------------------------------------------------- derived
const growSecs = c => c.secs * Math.pow(0.88, G.upg.sprinkler);
const workSecs = s => s * Math.pow(0.88, G.upg.oven);
const price = id => Math.round(ITEMS[id].sell * Math.pow(1.10, G.upg.market));
const cropOf = id => CROPS.find(c => c.id === id);
const have = id => G.inv[id] || 0;
const unlockedCrops = () => CROPS.filter(c => c.lvl <= G.lvl);
const canAfford = n => G.coins >= n;

function take(id, n) { if (have(id) < n) return false; G.inv[id] -= n; if (G.inv[id] <= 0) delete G.inv[id]; return true; }
function give(id, n) { G.inv[id] = have(id) + n; }
function pay(n) { if (!canAfford(n)) return false; G.coins -= n; return true; }
function gain(n) { G.coins += n; G.earned += n; }

// ---------------------------------------------------------------- progress
function addXp(n) {
  G.xp += n;
  let leveled = false;
  while (G.xp >= xpNeed(G.lvl)) { G.xp -= xpNeed(G.lvl); G.lvl++; leveled = true; }
  if (leveled) onLevelUp();
}
function unlockedAt(lvl) {
  const bits = [];
  for (const c of CROPS) if (c.lvl === lvl) bits.push(ITEMS[c.id].n);
  for (const a of ANIMALS) if (a.lvl === lvl) bits.push(a.n);
  for (const b of BUILDS) if (b.lvl === lvl) bits.push(b.n);
  return bits;
}
function onLevelUp() {
  const got = unlockedAt(G.lvl);
  banner("Level " + G.lvl, got.length ? got.join(" and ") + " unlocked" : "Keep going");
  sfx("level"); build();
}
function goalProgress() {
  const g = LEVELS[Math.min(G.goal, LEVELS.length - 1)];
  if (!g) return { at: 0, of: 1 };
  if (g.k === "harvest") return { at: G.harvested[g.item] || 0, of: g.n };
  if (g.k === "earn") return { at: G.earned, of: g.n };
  if (g.k === "plots") return { at: G.owned, of: g.n };
  if (g.k === "upg") return { at: G.upg[g.item] || 0, of: g.n };
  if (g.k === "any") return { at: Object.values(G.inv).reduce((a, b) => a + b, 0), of: g.n };
  return { at: 0, of: 1 };
}
function checkGoal() {
  if (G.goal >= LEVELS.length) return;
  const g = LEVELS[G.goal], p = goalProgress();
  if (p.at < p.of) return;
  gain(g.coins); G.goal++;
  banner("Goal complete", "+" + fmt(g.coins) + " coins");
  sfx("goal");
}

// ---------------------------------------------------------------- fields
function plotState(p) {
  if (!p) return { kind: "empty" };
  const c = cropOf(p.crop);
  if (!c) return { kind: "empty" };
  const total = growSecs(c) * 1000, left = p.at + total - now();
  return left <= 0 ? { kind: "ready", c } : { kind: "growing", c, left, frac: 1 - left / total };
}
function plant(i) {
  if (i >= G.owned || G.plots[i]) return false;
  const c = cropOf(G.seed);
  if (!c || c.lvl > G.lvl) return false;
  if (!pay(c.cost)) { sfx("no"); flash("Not enough coins", "#e57a5a", i); return false; }
  G.plots[i] = { crop: c.id, at: now() };
  sfx("plant"); return true;
}
function harvest(i, quiet) {
  const st = plotState(G.plots[i]);
  if (st.kind !== "ready") return false;
  const id = st.c.id;
  give(id, 1);
  G.harvested[id] = (G.harvested[id] || 0) + 1;
  addXp(st.c.xp);
  G.plots[i] = null;
  if (!quiet) { flash("+1 " + ITEMS[id].n, "#2f6b2a", i); sfx("pop"); }
  return true;
}
/* A farmhand works one field forever: harvest, replant, repeat. This is the
   whole idle engine, and the same routine runs for time spent away. */
function farmhandTick() {
  const hands = G.upg.hand;
  if (!hands) return;
  let used = 0;
  for (let i = 0; i < G.owned && used < hands; i++) {
    const st = plotState(G.plots[i]);
    if (st.kind === "ready") {
      harvest(i, true);
      const c = cropOf(G.seed);
      if (c && c.lvl <= G.lvl && canAfford(c.cost)) { pay(c.cost); G.plots[i] = { crop: c.id, at: now() }; }
      used++;
    } else if (st.kind === "empty") {
      const c = cropOf(G.seed);
      if (c && c.lvl <= G.lvl && canAfford(c.cost)) { pay(c.cost); G.plots[i] = { crop: c.id, at: now() }; used++; }
    }
  }
}

// ---------------------------------------------------------------- animals and workshops
function unitState(u, def) {
  if (!u || !u.owned) return { kind: "locked" };
  if (u.at == null) return { kind: "idle" };
  const total = workSecs(def.secs) * 1000, left = u.at + total - now();
  return left <= 0 ? { kind: "ready" } : { kind: "busy", left, frac: 1 - left / total };
}
function needs(def) { return def.feed || def.in; }
function canStart(def) { return Object.entries(needs(def)).every(([k, v]) => have(k) >= v); }
function startUnit(store, def) {
  const u = store[def.id];
  if (!u || !u.owned || u.at != null) return false;
  if (!canStart(def)) {
    const missing = Object.entries(needs(def)).find(([k, v]) => have(k) < v);
    flash("Need " + ITEMS[missing[0]].n, "#e57a5a"); sfx("no"); return false;
  }
  for (const [k, v] of Object.entries(needs(def))) take(k, v);
  u.at = now(); sfx("plant"); return true;
}
function collectUnit(store, def) {
  const u = store[def.id];
  if (unitState(u, def).kind !== "ready") return false;
  give(def.out, 1);
  G.harvested[def.out] = (G.harvested[def.out] || 0) + 1;
  addXp(def.xp); u.at = null;
  flash("+1 " + ITEMS[def.out].n, "#2f6b2a"); sfx("pop");
  return true;
}
function sell(id, n) {
  n = Math.min(n, have(id));
  if (n <= 0) return 0;
  take(id, n);
  const got = price(id) * n;
  gain(got); sfx("coin");
  return got;
}

// ---------------------------------------------------------------- time away
/* Fields keep growing while the tab is closed because readiness is a timestamp
   comparison, not a counter. Farmhands are the only thing that needs simulating. */
function catchUp() {
  const elapsed = Math.min(OFFLINE_CAP, Math.max(0, (now() - (G.seen || now())) / 1000));
  G.seen = now();
  if (elapsed < 60 || !G.upg.hand) return null;
  const c = cropOf(G.seed) || CROPS[0];
  const cycle = growSecs(c);
  const cycles = Math.floor(elapsed / cycle);
  if (cycles <= 0) return null;
  const fields = Math.min(G.upg.hand, G.owned);
  const runs = cycles * fields;
  const profit = Math.max(0, price(c.id) - c.cost) * runs;
  gain(profit);
  G.harvested[c.id] = (G.harvested[c.id] || 0) + runs;
  addXp(c.xp * runs);
  return { secs: elapsed, runs, item: c.id, profit };
}

// ---------------------------------------------------------------- sound
let AC = null;
function sfx(kind) {
  if (!G.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const notes = {
      plant: [[220, .07, "sine"]], pop: [[520, .07, "triangle"], [780, .09, "triangle"]],
      coin: [[880, .05, "square"], [1320, .07, "square"]],
      buy: [[300, .08, "sine"], [450, .1, "sine"]],
      no: [[130, .14, "sawtooth"]],
      level: [[523, .1, "sine"], [659, .1, "sine"], [784, .16, "sine"]],
      goal: [[659, .09, "triangle"], [880, .14, "triangle"]],
    }[kind] || [[440, .06, "sine"]];
    notes.forEach(([f, d, type], i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      o.connect(g); g.connect(AC.destination);
      const at = t + i * 0.055;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.15, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.start(at); o.stop(at + d + 0.02);
    });
  } catch (e) { /* audio is a nicety, never a blocker */ }
}

// ---------------------------------------------------------------- feedback
const $ = id => document.getElementById(id);
const fx = $("fx"), app = $("app");
function at(el) {
  const a = app.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height / 2 };
}
function flash(text, colour, plotIndex) {
  const anchor = plotIndex != null && nodes.plots[plotIndex] ? nodes.plots[plotIndex] : $("goalCard");
  const p = at(anchor);
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text;
  el.style.cssText = `left:${p.x}px; top:${p.y}px; color:${colour || "#2f6b2a"}`;
  fx.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}
function coinBurst(fromEl, count) {
  const a = at(fromEl), b = at($("purse"));
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "coinfly"; el.innerHTML = ART.coin;
    const jx = (Math.random() - .5) * 46, jy = (Math.random() - .5) * 26;
    el.style.cssText = `left:${a.x - 10}px; top:${a.y - 10}px`;
    fx.appendChild(el);
    const dur = 460 + Math.random() * 220, start = performance.now();
    const step = t => {
      const k = Math.min(1, (t - start) / dur), e = k * k * (3 - 2 * k);
      const cx = a.x + (b.x - a.x) * e + jx * (1 - e) * (1 - e);
      const cy = a.y + (b.y - a.y) * e + jy * (1 - e) - Math.sin(e * Math.PI) * 26;
      el.style.transform = `translate(${cx - a.x}px,${cy - a.y}px) scale(${1 - e * .35})`;
      if (k < 1) requestAnimationFrame(step);
      else { el.remove(); $("purse").classList.add("pulse"); setTimeout(() => $("purse").classList.remove("pulse"), 460); }
    };
    setTimeout(() => requestAnimationFrame(step), i * 45);
  }
}
let bannerT = 0;
function banner(big, sm) {
  $("bannerBig").textContent = big; $("bannerSm").textContent = sm;
  $("banner").classList.add("on"); bannerT = now() + 1900;
}

// ---------------------------------------------------------------- build the dom
const nodes = { plots: [], pens: {}, builds: {} };
function build() {
  // fields
  const wrap = $("plots"); wrap.innerHTML = ""; nodes.plots = [];
  for (let i = 0; i < MAX_PLOTS; i++) {
    const d = document.createElement("button");
    d.className = "plot"; d.dataset.i = i;
    d.innerHTML = `<span class="furrow"></span><span class="art"></span>
      <span class="timer" style="display:none"><i></i></span>`;
    d.addEventListener("click", () => tapPlot(i));
    wrap.appendChild(d); nodes.plots.push(d);
  }
  // animals
  const pens = $("pens"); pens.innerHTML = ""; nodes.pens = {};
  for (const a of ANIMALS) {
    const c = document.createElement("button");
    c.className = "card"; c.innerHTML = cardHtml(a, a.art);
    c.addEventListener("click", () => tapUnit(G.animals, a, c));
    pens.appendChild(c); nodes.pens[a.id] = c;
  }
  // workshops
  const bs = $("builds"); bs.innerHTML = ""; nodes.builds = {};
  for (const b of BUILDS) {
    const c = document.createElement("button");
    c.className = "card"; c.innerHTML = cardHtml(b, b.art);
    c.addEventListener("click", () => tapUnit(G.builds, b, c));
    bs.appendChild(c); nodes.builds[b.id] = c;
  }
  buildRail(); paint();
}
function cardHtml(def, art) {
  const ins = Object.entries(needs(def)).map(([k, v]) => v + " " + ITEMS[k].n).join(" + ");
  return `<span class="cost"></span>
    <span class="top"><span class="pic">${ART[art]}</span>
    <span><span class="nm">${def.n}</span><span class="sub">${ins} &rarr; ${ITEMS[def.out].n}</span></span></span>
    <span class="bar" style="display:none"><i></i></span>`;
}
function buildRail() {
  const rail = $("rail"); rail.innerHTML = "";
  if (G.tab === "seeds") {
    for (const c of CROPS) {
      const locked = c.lvl > G.lvl;
      const b = document.createElement("button");
      b.className = "seed" + (G.seed === c.id ? " on" : "") + (locked || !canAfford(c.cost) ? " no" : "");
      b.innerHTML = `${ART[ITEMS[c.id].a]}<span class="nm">${ITEMS[c.id].n}</span>
        <span class="pr">${locked ? "Lv " + c.lvl : fmt(c.cost)}</span>`;
      if (!locked) b.addEventListener("click", () => { G.seed = c.id; sfx("plant"); buildRail(); });
      else b.addEventListener("click", () => { flash("Reach level " + c.lvl, "#e57a5a"); sfx("no"); });
      rail.appendChild(b);
    }
  } else {
    const owned = Object.keys(ITEMS).filter(k => have(k) > 0);
    if (!owned.length) {
      rail.innerHTML = `<div style="color:#fbe6c8;font-size:12.5px;font-weight:700;padding:14px 6px">
        Your barn is empty. Harvest something.</div>`;
      return;
    }
    for (const k of owned) {
      const b = document.createElement("button");
      b.className = "seed";
      b.innerHTML = `<span class="have">${have(k)}</span>${ART[ITEMS[k].a]}
        <span class="nm">${ITEMS[k].n}</span><span class="pr">${fmt(price(k))}</span>`;
      b.addEventListener("click", () => {
        const got = sell(k, 1);
        if (got) { flash("+" + fmt(got), "#c8811a"); coinBurst(b, 3); buildRail(); paint(); save(); }
      });
      rail.appendChild(b);
    }
    const all = document.createElement("button");
    all.className = "seed"; all.style.background = "#ffe9b8";
    const total = owned.reduce((s, k) => s + price(k) * have(k), 0);
    all.innerHTML = `${ART.coin}<span class="nm">Sell all</span><span class="pr">${fmt(total)}</span>`;
    all.addEventListener("click", () => {
      let got = 0; for (const k of owned) got += sell(k, have(k));
      if (got) { flash("+" + fmt(got), "#c8811a"); coinBurst(all, 7); buildRail(); paint(); save(); }
    });
    rail.appendChild(all);
  }
}

// ---------------------------------------------------------------- paint
function paint() {
  $("coins").textContent = fmt(G.coins);
  $("lvlBadge").textContent = G.lvl;
  const need = xpNeed(G.lvl);
  $("xpBar").style.width = Math.min(100, G.xp / need * 100) + "%";
  $("xpTxt").textContent = G.xp + " / " + need;

  const g = LEVELS[Math.min(G.goal, LEVELS.length - 1)], p = goalProgress();
  const done = G.goal >= LEVELS.length;
  $("goalTag").textContent = done ? "All goals complete" : "Goal " + (G.goal + 1) + " of " + LEVELS.length;
  $("goalText").textContent = done ? "Farm as big as you like" : g.t;
  $("goalBar").style.width = (done ? 100 : Math.min(100, p.at / p.of * 100)) + "%";
  $("goalReward").textContent = done ? "" : "+" + fmt(g.coins);
  $("goalRewardIcon").innerHTML = done ? "" : ART.coin;

  $("penSect").style.display = ANIMALS.some(a => a.lvl <= G.lvl) ? "" : "none";
  $("pens").style.display = ANIMALS.some(a => a.lvl <= G.lvl) ? "" : "none";
  $("bldSect").style.display = BUILDS.some(b => b.lvl <= G.lvl) ? "" : "none";
  $("builds").style.display = BUILDS.some(b => b.lvl <= G.lvl) ? "" : "none";
}
// tick runs every frame, so it must never reparse SVG it has already drawn
function setArt(node, key, html) {
  if (node.dataset.k === key) return;
  node.dataset.k = key; node.innerHTML = html;
}
function tick() {
  for (let i = 0; i < MAX_PLOTS; i++) {
    const node = nodes.plots[i];
    if (i >= G.owned) {
      const next = i === G.owned;
      node.style.display = i <= G.owned ? "" : "none";
      node.className = "plot buy";
      setArt(node.querySelector(".art"), "none", "");
      node.querySelector(".timer").style.display = "none";
      if (!node.querySelector(".lock")) node.insertAdjacentHTML("beforeend", `<span class="lock"></span>`);
      setArt(node.querySelector(".lock"), next ? "next" + PLOT_COST(i) : "far",
        next ? `${ART.lock}New field<br/>${fmt(PLOT_COST(i))}` : "");
      continue;
    }
    const lock = node.querySelector(".lock"); if (lock) lock.remove();
    node.style.display = "";
    const st = plotState(G.plots[i]);
    const art = node.querySelector(".art"), timer = node.querySelector(".timer");
    if (st.kind === "empty") {
      node.className = "plot empty";
      const a = ITEMS[G.seed] ? ITEMS[G.seed].a : "wheat";
      setArt(art, "ghost:" + a, ART[a]);
      timer.style.display = "none";
    } else if (st.kind === "ready") {
      node.className = "plot ready";
      setArt(art, "ripe:" + st.c.id, ART[ITEMS[st.c.id].a]);
      timer.style.display = "none";
    } else {
      node.className = "plot";
      const stage = st.frac > .62 ? "growing" : st.frac > .28 ? "sprout" : "seed";
      setArt(art, stage, ART[stage]);
      timer.style.display = ""; timer.firstElementChild.style.width = (st.frac * 100) + "%";
    }
  }
  const paintUnit = (store, def, node) => {
    const open = def.lvl <= G.lvl;
    node.style.display = open ? "" : "none";
    if (!open) return;
    const u = store[def.id], st = unitState(u, def);
    const bar = node.querySelector(".bar"), cost = node.querySelector(".cost");
    node.className = "card" + (st.kind === "ready" ? " ready" : "") + (st.kind === "locked" ? " locked" : "");
    setArt(cost, st.kind === "locked" ? "buy" : "own",
      st.kind === "locked"
        ? ART.coin.replace("<svg", '<svg style="width:13px;height:13px;vertical-align:-2px"') + " " + fmt(def.cost)
        : "");
    if (st.kind === "busy") { bar.style.display = ""; bar.firstElementChild.style.width = (st.frac * 100) + "%"; }
    else bar.style.display = "none";
  };
  for (const a of ANIMALS) paintUnit(G.animals, a, nodes.pens[a.id]);
  for (const b of BUILDS) paintUnit(G.builds, b, nodes.builds[b.id]);
  if (bannerT && now() > bannerT) { $("banner").classList.remove("on"); bannerT = 0; }
}

// ---------------------------------------------------------------- taps
function tapPlot(i) {
  if (i > G.owned) return;
  if (i === G.owned) {
    const c = PLOT_COST(i);
    if (!pay(c)) { sfx("no"); flash("Need " + fmt(c), "#e57a5a"); return; }
    G.owned++; sfx("buy"); flash("New field", "#2f6b2a", i); checkGoal(); paint(); save(); return;
  }
  const st = plotState(G.plots[i]);
  if (st.kind === "empty") { if (plant(i)) { buildRail(); paint(); save(); } }
  else if (st.kind === "ready") {
    harvest(i); coinBurst(nodes.plots[i], 2);
    checkGoal(); buildRail(); paint(); save();
  } else flash(clock(st.left / 1000), "#8a6a45", i);
}
function tapUnit(store, def, node) {
  if (def.lvl > G.lvl) { flash("Reach level " + def.lvl, "#e57a5a"); sfx("no"); return; }
  const u = store[def.id];
  if (!u || !u.owned) {
    if (!pay(def.cost)) { sfx("no"); flash("Need " + fmt(def.cost), "#e57a5a"); return; }
    store[def.id] = { owned: 1, at: null };
    sfx("buy"); flash("Built " + def.n, "#2f6b2a"); paint(); save(); return;
  }
  const st = unitState(u, def);
  if (st.kind === "ready") { collectUnit(store, def); coinBurst(node, 2); checkGoal(); buildRail(); paint(); save(); }
  else if (st.kind === "idle") { if (startUnit(store, def)) { buildRail(); paint(); save(); } }
  else flash(clock(st.left / 1000), "#8a6a45");
}

// ---------------------------------------------------------------- sheets
function sheet(html) { $("sheetPane").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); }
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });

function shopSheet() {
  let h = `<h2>Shop</h2><p class="lede">Upgrades stay with you. Buy the farmhand and the farm keeps working while the tab is shut.</p>`;
  for (const u of UPGRADES) {
    const lvl = G.upg[u.id] || 0, maxed = lvl >= u.max, c = u.cost(lvl);
    h += `<div class="row"><span class="pic">${ART[u.art]}</span>
      <span class="who"><b>${u.n} ${lvl ? "&middot; level " + lvl : ""}</b><span>${u.d}</span></span>
      ${maxed ? `<span class="btn flat" style="opacity:.6">Maxed</span>`
        : `<button class="btn${canAfford(c) ? "" : " flat"}" data-upg="${u.id}" ${canAfford(c) ? "" : "disabled"}>${fmt(c)}</button>`}</div>`;
  }
  h += `<h2 style="margin-top:14px">Land</h2>`;
  if (G.owned < MAX_PLOTS) {
    const c = PLOT_COST(G.owned);
    h += `<div class="row"><span class="pic">${ART.lettuce}</span>
      <span class="who"><b>Field ${G.owned + 1}</b><span>One more plot to plant</span></span>
      <button class="btn${canAfford(c) ? "" : " flat"}" data-plot="1" ${canAfford(c) ? "" : "disabled"}>${fmt(c)}</button></div>`;
  } else h += `<div class="row"><span class="who"><b>All 12 fields are yours</b></span></div>`;
  h += `<button class="btn wide flat" data-close="1">Close</button>`;
  sheet(h);
  $("sheetPane").querySelectorAll("[data-upg]").forEach(b => b.addEventListener("click", () => {
    const u = UPGRADES.find(x => x.id === b.dataset.upg), lvl = G.upg[u.id] || 0;
    if (lvl >= u.max || !pay(u.cost(lvl))) { sfx("no"); return; }
    G.upg[u.id] = lvl + 1; sfx("buy"); checkGoal(); build(); save(); shopSheet();
  }));
  const pb = $("sheetPane").querySelector("[data-plot]");
  if (pb) pb.addEventListener("click", () => {
    if (!pay(PLOT_COST(G.owned))) { sfx("no"); return; }
    G.owned++; sfx("buy"); checkGoal(); paint(); save(); shopSheet();
  });
  $("sheetPane").querySelector("[data-close]").addEventListener("click", closeSheet);
}
function menuSheet() {
  sheet(`<h2>Acre</h2><p class="lede">Tap a field to plant, tap it again when it is ready. Sell from the Barn,
    then spend on better crops, animals and workshops. Workshops turn cheap goods into expensive ones,
    which is where the real money is.</p>
    <div class="row"><span class="who"><b>Level ${G.lvl}</b><span>${fmt(G.earned)} coins earned all time</span></span></div>
    <div class="row"><span class="who"><b>Sound</b><span>Short procedural effects, no files</span></span>
      <button class="btn${G.sound ? "" : " flat"}" data-snd="1">${G.sound ? "On" : "Off"}</button></div>
    <div class="row"><span class="who"><b>Start over</b><span>Wipes this farm from your device</span></span>
      <button class="btn flat" data-reset="1">Reset</button></div>
    <button class="btn wide flat" data-close="1">Close</button>`);
  $("sheetPane").querySelector("[data-snd]").addEventListener("click", () => {
    G.sound = !G.sound; save(); menuSheet();
  });
  $("sheetPane").querySelector("[data-reset]").addEventListener("click", () => {
    if (!confirm("Delete this farm and start again?")) return;
    localStorage.removeItem(SAVE); G = freshState(); closeSheet(); build(); save();
  });
  $("sheetPane").querySelector("[data-close]").addEventListener("click", closeSheet);
}
function awaySheet(info) {
  sheet(`<h2>While you were away</h2>
    <p class="lede">Your farmhands kept working for ${clock(info.secs)}.</p>
    <div class="row"><span class="pic">${ART[ITEMS[info.item].a]}</span>
      <span class="who"><b>${info.runs} &times; ${ITEMS[info.item].n}</b><span>harvested and replanted</span></span></div>
    <div class="row"><span class="pic">${ART.coin}</span>
      <span class="who"><b>+${fmt(info.profit)} coins</b><span>after seed costs</span></span></div>
    <button class="btn wide gold" data-close="1">Collect</button>`);
  $("sheetPane").querySelector("[data-close]").addEventListener("click", closeSheet);
}

// ---------------------------------------------------------------- save
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(writeSave, 400); }
function writeSave() {
  try { G.seen = now(); localStorage.setItem(SAVE, JSON.stringify(G)); }
  catch (e) { /* a full disk must not break play */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || !Array.isArray(d.plots)) return false;
    G = Object.assign(freshState(), d);
    G.upg = Object.assign({ sprinkler: 0, market: 0, hand: 0, oven: 0 }, d.upg || {});
    G.plots = Array.from({ length: MAX_PLOTS }, (_, i) => d.plots[i] || null);
    return true;
  } catch (e) { return false; }
}

// ---------------------------------------------------------------- loop and boot
let handT = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!running) return;
  tick();
  if (now() - handT > 1000) { handT = now(); farmhandTick(); checkGoal(); paint(); }
}
function start(fresh) {
  if (fresh) { localStorage.removeItem(SAVE); G = freshState(); }
  const info = catchUp();
  $("start").classList.add("off");
  running = true; build(); save();
  if (info && info.profit > 0) awaySheet(info);
}
document.querySelectorAll(".tt").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tt").forEach(x => x.classList.remove("on"));
  t.classList.add("on"); G.tab = t.dataset.tab; buildRail();
}));
$("btnShop").addEventListener("click", shopSheet);
$("btnMenu").addEventListener("click", menuSheet);
$("btnSound").addEventListener("click", () => {
  G.sound = !G.sound;
  $("btnSound").setAttribute("aria-pressed", G.sound ? "true" : "false");
  $("btnSound").style.opacity = G.sound ? "1" : ".5";
  sfx("pop"); save();
});
$("btnPlay").addEventListener("click", () => start(true));
$("btnContinue").addEventListener("click", () => start(false));
addEventListener("visibilitychange", () => { if (document.hidden) writeSave(); });
addEventListener("beforeunload", writeSave);

$("coinIcon").innerHTML = ART.coin;
$("gemIcon").innerHTML = ART.gem;
$("startScene").innerHTML = startSceneArt();
if (load()) {
  $("btnContinue").style.display = "";
  $("btnPlay").textContent = "New farm";
  $("btnPlay").className = "btn wide flat";
  $("btnContinue").className = "btn wide gold";
}
requestAnimationFrame(frame);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
<script data-count="acre">
/* Anonymous page count: no cookies, no identifier, no path, nothing about you.
   One ping saying "a page was opened" and which site linked here. Honours
   Do Not Track and Global Privacy Control, and fails silently offline. */
(function(){try{
  var n=navigator;
  if(n.doNotTrack==="1"||window.doNotTrack==="1"||n.msDoNotTrack==="1"||n.globalPrivacyControl)return;
  if(n.onLine===false)return;
  var h="";try{if(document.referrer)h=new URL(document.referrer).hostname;}catch(e){}
  if(h===location.hostname)h="";
  var u="https://portfolio-likes.onrender.com/api/view/acre"+(h?"?r="+encodeURIComponent(h):"");
  if(n.sendBeacon)n.sendBeacon(u);
  else fetch(u,{method:"POST",mode:"no-cors",keepalive:true}).catch(function(){});
}catch(e){}})();
</script>
